[package]
name = "win-notifi-toast"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
async-openai = "0.28"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
raw-window-handle = "0.6"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tray-icon = "=0.21.3"
unicode-segmentation = "1"
windows = { version = "0.61", features = ["Win32_System_WindowsProgramming", "Win32_System_Registry", "Win32_Security", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[dev-dependencies]
tempfile = "3"

